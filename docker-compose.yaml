# ~/~ begin <<README.md#docker-compose.yaml>>[init]
services:
    # ~/~ begin <<README.md#compose-services>>[init]
    docktail:
        image: ghcr.io/marvinvr/docktail:latest
        container_name: docktail
        restart: unless-stopped
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
          - "/var/run/tailscale:/var/run/tailscale"
        environment:
          - "TAILSCALE_OAUTH_CLIENT_ID=${TAILSCALE_OAUTH_CLIENT_ID}"
          - "TAILSCALE_OAUTH_CLIENT_SECRET=${TAILSCALE_OAUTH_CLIENT_SECRET}"
    # ~/~ end
    # ~/~ begin <<README.md#compose-services>>[1]
    copyparty:
        image: copyparty/ac:latest
        container_name: copyparty
        restart: unless-stopped
        user: "1000:1000"
        ports:
            - "3923:3923"
        labels:
            - "docktail.service.enable=true"
            - "docktail.service.name=copyparty${SERVICE_SUFFIX}"
            - "docktail.service.port=3923"
            - "docktail.service.service-port=443"
        volumes:
            - "${COPYPARTY_CONFIG:-./copyparty-dev.conf}:/cfg/copyparty.conf:z"
            - "${COPYPARTY_SHARE}:/share:z"
    # ~/~ end
# ~/~ end
